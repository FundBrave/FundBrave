services:
  postgres:
    image: postgres:16-alpine
    container_name: fundbrave-mvp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundbrave
      POSTGRES_PASSWORD: fundbrave
      POSTGRES_DB: fundbrave_mvp
    ports:
      - "5432:5432"
    volumes:
      - fundbrave_mvp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundbrave -d fundbrave_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fundbrave_mvp_pgdata:
